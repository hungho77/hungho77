<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ho Thinh Hung — Senior Edge AI Engineer</title>
  <desc id="desc">Blue technical banner with the HT monogram and the phrase Small models. Big machines.</desc>
  <defs>
    <linearGradient id="background" x1="50" y1="20" x2="1135" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#031020"/>
      <stop offset="0.56" stop-color="#071A36"/>
      <stop offset="1" stop-color="#0A2144"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(890 170) rotate(180) scale(470 260)">
      <stop stop-color="#246BFE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#246BFE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#8ED2FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="25.25" stroke="#62A5FF" stroke-opacity="0.42" stroke-width="1.5"/>

  <circle cx="1020" cy="-10" r="210" fill="#246BFE" fill-opacity="0.08"/>
  <circle cx="1020" cy="-10" r="154" stroke="#62A5FF" stroke-opacity="0.12"/>
  <circle cx="1020" cy="-10" r="105" stroke="#8ED2FF" stroke-opacity="0.08"/>

  <g transform="translate(70 70)">
    <rect x="0" y="0" width="96" height="96" rx="12" fill="#0D2955" fill-opacity="0.66" stroke="#62A5FF" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M18 17V78M18 48H47M47 17V78M59 17H82M70.5 17V78" stroke="#F7FBFF" stroke-width="5" stroke-linecap="square"/>
    <path d="M72 0V24H96" stroke="#62A5FF" stroke-width="4"/>
    <rect x="12" y="84" width="72" height="4" rx="2" fill="#246BFE" filter="url(#shadow)"/>
  </g>

  <g font-family="Inter, Manrope, Arial, sans-serif">
    <text x="204" y="97" fill="#8ED2FF" font-size="14" font-weight="600" letter-spacing="3.2">SENIOR EDGE AI ENGINEER</text>
    <text x="204" y="160" fill="#F7FBFF" font-size="50" font-weight="700" letter-spacing="-1.8">Ho Thinh Hung</text>
    <text x="204" y="207" fill="#8FA8C3" font-size="21" font-weight="500">VLA systems · model optimization · physical AI</text>
    <text x="70" y="307" fill="#F7FBFF" font-size="28" font-weight="650" letter-spacing="-0.5">Small models.</text>
    <text x="260" y="307" fill="#62A5FF" font-size="28" font-weight="650" letter-spacing="-0.5">Big machines.</text>
  </g>

  <g transform="translate(847 252)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">
    <rect width="283" height="45" rx="10" fill="#031020" fill-opacity="0.72" stroke="#62A5FF" stroke-opacity="0.32"/>
    <circle cx="21" cy="22.5" r="4" fill="#3682FF"/>
    <text x="37" y="27" fill="#8ED2FF">VLA  /  INT4  /  EDGE</text>
  </g>
</svg>
